name: go3net-office

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: go3net
      POSTGRES_USER: go3net
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go3net"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: base
    environment: &api_env
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: go3net
      DB_USERNAME: go3net
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      # Mail (log driver until SMTP creds are set)
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-office@go3net.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Go3net Office}
      # Real-time (Reverb)
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-go3net}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      # Integrations (blank disables the feature gracefully)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - apistorage:/var/www/html/storage/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: worker
    environment: *api_env
    volumes:
      - apistorage:/var/www/html/storage/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: scheduler
    environment: *api_env
    volumes:
      - apistorage:/var/www/html/storage/app
    depends_on:
      postgres: { condition: service_healthy }

  # WebSocket server for real-time chat (Laravel Reverb)
  reverb:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: base
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *api_env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time.
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${PUBLIC_HOST:-localhost}
        NEXT_PUBLIC_REVERB_PORT: ${PUBLIC_WS_PORT:-8080}
        NEXT_PUBLIC_REVERB_SCHEME: ${PUBLIC_SCHEME:-http}
    environment:
      # Server-side BFF → API (nginx internal listener with the api vhost)
      API_URL: http://nginx:81

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - reverb

volumes:
  pgdata:
  redisdata:
  apistorage:
