worker_processes auto;

events { worker_connections 2048; }

http {
    include mime.types;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream api_fpm { server api:9000; }
    upstream web_app { server web:3000; }
    upstream reverb_ws { server reverb:8080; }

    # WebSocket upgrade helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # API — api.go3net.app publicly, and :81 internally for the BFF
    server {
        listen 80;
        listen 81;
        server_name api.* localhost nginx;

        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass api_fpm;
            fastcgi_index index.php;
            # Fixed path inside the FPM container — nginx has no app files.
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Web app — *.go3net.app (tenant subdomains)
    server {
        listen 80 default_server;
        server_name _;

        location /_next/static/ {
            proxy_pass http://web_app;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Reverb WebSocket (Echo connects to wss://<host>/app/<key>)
        location /app/ {
            proxy_pass http://reverb_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300;
        }

        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
